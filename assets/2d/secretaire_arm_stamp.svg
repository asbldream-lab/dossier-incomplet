<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="neon" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#5e6b52"/>
      <stop offset="0.45" stop-color="#262a22"/>
      <stop offset="1" stop-color="#0b0c0a"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfc8b6"/>
      <stop offset="0.6" stop-color="#a39c8a"/>
      <stop offset="1" stop-color="#6d685b"/>
    </linearGradient>
    <linearGradient id="cardigan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3442"/>
      <stop offset="1" stop-color="#1e141b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7e6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b9c4a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e9eed8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4036"/>
      <stop offset="0.08" stop-color="#2c251f"/>
      <stop offset="1" stop-color="#0f0c0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.55 0"/>
    </filter>
  </defs><!-- RIGHT ARM (viewer left) raised with the giant stamp -->
  <path d="M190 470 Q140 430 132 340 L168 330 Q178 410 222 445 Z" fill="url(#cardigan)"/>
  <path d="M132 340 Q128 290 150 248 L178 256 Q166 300 168 336 Z" fill="#3e2b37"/>
  <!-- hand gripping handle -->
  <path d="M146 250 Q140 226 156 214 L188 218 Q196 236 182 258 Z" fill="url(#skin)"/>
  <path d="M152 228 L186 232 M150 240 L184 244" stroke="#5e584c" stroke-width="2"/>
  <!-- stamp -->
  <g transform="rotate(-12 170 170)">
    <rect x="156" y="120" width="28" height="100" rx="10" fill="#4f3220"/>
    <ellipse cx="170" cy="118" rx="26" ry="20" fill="#5e3b26"/>
    <rect x="108" y="40" width="124" height="70" rx="4" fill="#5a0b0b"/>
    <rect x="108" y="96" width="124" height="14" fill="#2b0505"/>
    <text x="170" y="84" font-family="Impact, Arial Black, sans-serif" font-size="28" text-anchor="middle" fill="#d22" transform="scale(1,1)">REFUSÉ</text>
  </g>
  <!-- ink dripping -->
  <path d="M120 112 q4 30 2 52 q6 -20 4 -52z" fill="#b01010"/>
  <circle cx="122" cy="176" r="4" fill="#b01010"/>

  </svg>
