<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="neon" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#5e6b52"/>
      <stop offset="0.45" stop-color="#262a22"/>
      <stop offset="1" stop-color="#0b0c0a"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfc8b6"/>
      <stop offset="0.6" stop-color="#a39c8a"/>
      <stop offset="1" stop-color="#6d685b"/>
    </linearGradient>
    <linearGradient id="cardigan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3442"/>
      <stop offset="1" stop-color="#1e141b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7e6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b9c4a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e9eed8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4036"/>
      <stop offset="0.08" stop-color="#2c251f"/>
      <stop offset="1" stop-color="#0f0c0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.55 0"/>
    </filter>
  </defs>

  <!-- wall -->
  <rect width="600" height="800" fill="url(#neon)"/>
  <g stroke="#000" stroke-opacity="0.25" stroke-width="2">
    <line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/><line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="100" y1="0" x2="100" y2="640"/><line x1="250" y1="0" x2="250" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/><line x1="530" y1="0" x2="530" y2="640"/>
  </g>
  <!-- flickering neon tube -->
  <rect x="150" y="18" width="300" height="12" rx="6" fill="#dfe8c8" filter="url(#glow)" opacity="0.9"/>
  <rect x="150" y="20" width="300" height="8" rx="4" fill="#f4f8e8"/>
  <!-- faded poster -->
  <g opacity="0.35" transform="rotate(-3 490 200)">
    <rect x="440" y="140" width="110" height="140" fill="#8a8670"/>
    <text x="495" y="185" font-family="Courier New, monospace" font-size="15" text-anchor="middle" fill="#2a1a1a">MERCI DE</text>
    <text x="495" y="205" font-family="Courier New, monospace" font-size="15" text-anchor="middle" fill="#2a1a1a">PATIENTER</text>
    <text x="495" y="245" font-family="Courier New, monospace" font-size="30" text-anchor="middle" fill="#5a0f0f">∞</text>
  </g>
  <!-- ink stains on wall -->
  <path d="M60 300 q10 -14 20 0 q4 40 -3 70 q-6 -30 -17 -70z" fill="#3a0606" opacity="0.6"/>

  <!-- shadow behind her -->
  <ellipse cx="300" cy="420" rx="210" ry="330" fill="#000" opacity="0.35" filter="url(#soft)"/>

  <!-- torso / cardigan -->
  <path d="M175 470 Q190 430 255 420 L345 420 Q410 430 425 470 L455 660 L145 660 Z" fill="url(#cardigan)"/>
  <!-- shirt V -->
  <path d="M268 420 L300 500 L332 420 Z" fill="#cfcbbd"/>
  <path d="M268 420 L285 455 L300 500 L292 430 Z" fill="#9c988b"/>
  <!-- cardigan buttons -->
  <circle cx="300" cy="540" r="5" fill="#120c10"/><circle cx="300" cy="590" r="5" fill="#120c10"/>

  <!-- neck (too long) -->
  <path d="M282 300 Q278 380 270 425 L330 425 Q322 380 318 300 Z" fill="url(#skin)"/>
  <path d="M282 330 Q290 345 300 340 Q310 345 318 330 L318 360 Q300 372 282 360Z" fill="#000" opacity="0.25"/>

  <!-- lanyard + badge -->
  <path d="M276 425 L296 545 M324 425 L304 545" stroke="#7a1414" stroke-width="5" fill="none"/>
  <g transform="rotate(4 300 575)">
    <rect x="262" y="545" width="76" height="56" rx="4" fill="#e5e2d6"/>
    <rect x="268" y="551" width="22" height="28" fill="#6d685b"/>
    <text x="314" y="562" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#222">AGENT</text>
    <text x="314" y="572" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#222">D'ACCUEIL</text>
    <rect x="296" y="585" width="36" height="6" fill="#7a1414"/>
  </g>

  <!-- head -->
  <ellipse cx="300" cy="230" rx="68" ry="90" fill="url(#skin)"/>
  <!-- cheek hollows -->
  <path d="M245 255 Q258 300 285 318 Q258 310 240 270Z" fill="#000" opacity="0.22"/>
  <path d="M355 255 Q342 300 315 318 Q342 310 360 270Z" fill="#000" opacity="0.3"/>
  <!-- hair: tight, pulled back -->
  <path d="M232 225 Q228 150 300 138 Q372 150 368 225 Q360 175 300 168 Q240 175 232 225Z" fill="#17110f"/>
  <circle cx="300" cy="128" r="36" fill="#17110f"/>
  <path d="M284 112 Q300 100 318 110" stroke="#3a2b25" stroke-width="3" fill="none"/>
  <!-- pencil in bun -->
  <line x1="250" y1="98" x2="352" y2="150" stroke="#c9a227" stroke-width="7" stroke-linecap="round"/>
  <line x1="345" y1="146" x2="356" y2="152" stroke="#2a2a2a" stroke-width="7"/>

  <!-- raised thin eyebrows -->
  <path d="M248 205 Q268 190 290 202" stroke="#2a1f1a" stroke-width="3" fill="none"/>
  <path d="M310 202 Q332 190 352 205" stroke="#2a1f1a" stroke-width="3" fill="none"/>
  <!-- cat-eye glasses, lenses glare hide the eyes -->
  <g stroke="#5c0d14" stroke-width="5" stroke-linejoin="round">
    <path d="M240 222 Q244 212 290 216 Q294 240 282 252 Q252 258 244 244 Q236 232 240 222Z" fill="url(#lens)"/>
    <path d="M360 222 Q356 212 310 216 Q306 240 318 252 Q348 258 356 244 Q364 232 360 222Z" fill="url(#lens)"/>
    <path d="M290 222 Q300 216 310 222" fill="none"/>
    <path d="M240 222 L226 214 M360 222 L374 214" fill="none"/>
  </g>
  <!-- tiny pupils staring through the glare -->
  <circle cx="268" cy="236" r="3.2" fill="#000"/>
  <circle cx="332" cy="236" r="3.2" fill="#000"/>
  <path d="M250 222 L262 218" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M316 222 L328 218" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- eye bags -->
  <path d="M252 262 Q266 270 282 262" stroke="#000" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <path d="M318 262 Q334 270 348 262" stroke="#000" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <!-- nose -->
  <path d="M300 240 L294 282 Q300 288 308 283" stroke="#5e584c" stroke-width="2.5" fill="none"/>
  <!-- too-wide polite smile -->
  <path d="M252 300 Q300 322 348 300" stroke="#3a1414" stroke-width="3" fill="none"/>
  <path d="M262 303 Q300 318 338 303 Q300 312 262 303Z" fill="#d9d4c2"/>
  <path d="M250 297 L254 304 M350 297 L346 304" stroke="#3a1414" stroke-width="2"/>

  <!-- desk -->
  <rect x="0" y="650" width="600" height="150" fill="url(#desk)"/>
  <rect x="0" y="646" width="600" height="6" fill="#6b5d4d"/>
  <!-- paper stacks -->
  <g>
    <rect x="40" y="618" width="120" height="32" fill="#bdb8a6"/>
    <rect x="46" y="604" width="112" height="16" fill="#d2cdbb"/>
    <rect x="36" y="592" width="118" height="14" fill="#c6c1af" transform="rotate(-2 95 599)"/>
    <rect x="50" y="580" width="104" height="14" fill="#ddd8c6" transform="rotate(3 102 587)"/>
    <rect x="60" y="606" width="40" height="14" fill="#7a1414" opacity="0.7"/>
  </g>
  <!-- name plate -->
  <g>
    <path d="M200 700 L400 700 L390 668 L210 668 Z" fill="#2a2a2a"/>
    <rect x="215" y="672" width="170" height="24" fill="#b39a52"/>
    <text x="300" y="690" font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#1a1408">Mme BERTRAND</text>
  </g>
  <!-- refused file on desk -->
  <g transform="rotate(-8 480 715)">
    <rect x="430" y="690" width="110" height="60" fill="#c8a868"/>
    <text x="485" y="728" font-family="Impact, Arial Black, sans-serif" font-size="18" text-anchor="middle" fill="#a01010" transform="rotate(-10 485 722)">INCOMPLET</text>
  </g>

  </svg>
