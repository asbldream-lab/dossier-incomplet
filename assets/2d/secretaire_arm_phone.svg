<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="neon" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#5e6b52"/>
      <stop offset="0.45" stop-color="#262a22"/>
      <stop offset="1" stop-color="#0b0c0a"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfc8b6"/>
      <stop offset="0.6" stop-color="#a39c8a"/>
      <stop offset="1" stop-color="#6d685b"/>
    </linearGradient>
    <linearGradient id="cardigan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3442"/>
      <stop offset="1" stop-color="#1e141b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7e6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b9c4a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e9eed8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4036"/>
      <stop offset="0.08" stop-color="#2c251f"/>
      <stop offset="1" stop-color="#0f0c0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.55 0"/>
    </filter>
  </defs><!-- LEFT ARM (viewer right) resting, holding phone receiver -->
  <path d="M410 470 Q448 540 440 620 L400 630 Q404 560 382 500 Z" fill="url(#cardigan)"/>
  <path d="M398 612 Q430 600 448 618 L446 650 L392 650 Z" fill="url(#skin)"/>
  <!-- long fingers on desk -->
  <path d="M396 648 l-10 18 M410 650 l-8 22 M424 650 l-4 22 M438 648 l2 18" stroke="#a39c8a" stroke-width="7" stroke-linecap="round"/>
  <path d="M440 600 Q500 590 515 630 L500 648 Q480 622 446 626Z" fill="#141414"/>
  <!-- curly phone cord -->
  <path d="M510 645 c10 10 -10 14 0 24 c10 10 -10 14 0 24 c10 10 -10 14 0 24 c10 10 -10 14 0 24" stroke="#141414" stroke-width="4" fill="none"/>

  </svg>
