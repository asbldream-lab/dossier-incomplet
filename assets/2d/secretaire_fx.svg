<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="neon" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#5e6b52"/>
      <stop offset="0.45" stop-color="#262a22"/>
      <stop offset="1" stop-color="#0b0c0a"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfc8b6"/>
      <stop offset="0.6" stop-color="#a39c8a"/>
      <stop offset="1" stop-color="#6d685b"/>
    </linearGradient>
    <linearGradient id="cardigan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3442"/>
      <stop offset="1" stop-color="#1e141b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7e6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b9c4a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e9eed8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4036"/>
      <stop offset="0.08" stop-color="#2c251f"/>
      <stop offset="1" stop-color="#0f0c0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.55 0"/>
    </filter>
  </defs><!-- atmosphere -->
  <rect width="600" height="800" fill="url(#vignette)"/>
  <rect width="600" height="800" filter="url(#grain)" opacity="0.35"/>
  <rect width="600" height="800" fill="#203018" opacity="0.08"/>
</svg>
